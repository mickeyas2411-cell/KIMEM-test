name: Bingo 10 LIVE reentry card recovery regression
on:
  pull_request:
    paths:
      - 'KIMEM_BINGO_Live_Game.html'
      - 'test/bingo10-live-reentry-recovery.test.mjs'
      - '.github/workflows/bingo10-live-reentry-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  reentry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test existing verified paid-card reentry with Telegram Mini App SDK
        run: node --test test/bingo10-live-reentry-recovery.test.mjs test/bingo10-card-grid-perf.test.mjs
