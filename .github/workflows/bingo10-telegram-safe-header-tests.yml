name: Bingo 10 Telegram native header layout repair checks
on:
  pull_request:
    paths:
      - 'KIMEM_BINGO_Live_Game.html'
      - 'KIMEM_BINGO_Game_Lobby.html'
      - 'test/bingo10-telegram-safe-header.test.mjs'
      - '.github/workflows/bingo10-telegram-safe-header-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-header:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify unchanged layout CSS, Telegram native header, paid cards, sound and 3000-card grid
        run: node --test test/bingo10-telegram-safe-header.test.mjs test/bingo10-live-reentry-recovery.test.mjs test/bingo10-shuffle-only-sound.test.mjs test/bingo10-card-grid-perf.test.mjs
