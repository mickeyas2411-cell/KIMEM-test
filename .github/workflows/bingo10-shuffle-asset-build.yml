name: Build isolated Bingo 10 chosen shuffle media asset
on:
  push:
    branches:
      - feature/bingo10-shuffle-audio-selected2-isolated-20261031
    paths:
      - 'audio-transfer/chunk*.b64'
permissions:
  contents: write
jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Assemble, hash-check, and commit the 4-second shuffle asset only
        shell: bash
        run: |
          set -euo pipefail
          for n in 1 2 3 4 5 6; do
            if [[ ! -s "audio-transfer/chunk${n}.b64" ]]; then
              echo "Waiting for audio chunk ${n}; no changes made."
              exit 0
            fi
          done
          cat audio-transfer/chunk{1,2,3,4,5,6}.b64 | base64 --decode > kimem-shuffle-selected-2.ogg
          printf '%s  %s\n' bfa92018d393d172ece24d7d3365178a361a58ac25e3140c5156503f07cdb251 kimem-shuffle-selected-2.ogg | sha256sum -c -
          file kimem-shuffle-selected-2.ogg
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add kimem-shuffle-selected-2.ogg
          git rm audio-transfer/chunk{1,2,3,4,5,6}.b64 .github/workflows/bingo10-shuffle-asset-build.yml
          git commit -m 'assets(bingo10): add verified compressed selected #2 4s shuffle soundtrack'
          git push
