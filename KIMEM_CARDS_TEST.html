<!doctype html><html lang="am"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KIMEM • Card Test</title><style>*{box-sizing:border-box}body{margin:0;background:linear-gradient(155deg,#030819,#0c234a);color:white;font:14px system-ui,sans-serif;padding:15px}.wrap{max-width:520px;margin:auto}h1{font-size:20px;color:#f5c768}p{color:#b4c9e9}.panel{border:1px solid #2d69aa;background:#0a1a37;border-radius:14px;padding:12px;margin:14px 0}.row{display:flex;gap:8px;align-items:center}input{background:#101f3e;border:1px solid #4583c8;color:white;border-radius:8px;padding:12px;width:100%;font-size:16px}button{border:0;background:linear-gradient(100deg,#0e80df,#6740e3);color:white;font-weight:800;border-radius:8px;padding:12px}.card{margin:12px 0;padding:9px;border:1px solid #5c88c6;border-radius:12px;background:#091631}.head{color:#f6c764;font-weight:900;margin-bottom:8px}.grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:4px}.cell{min-width:0;aspect-ratio:1;display:grid;place-items:center;background:linear-gradient(#e9f2ff,#b8cde8);color:#09234b;border-radius:5px;font-size:clamp(14px,4.6vw,22px);font-weight:900}.letter{aspect-ratio:auto;background:#173964;color:white;padding:7px 0}.free{background:#f2c565;color:#1a2340}.hint{font-size:12px;color:#9bbbe4}</style></head><body><div class="wrap"><h1>KIMEM BINGO • MY CARDS TEST</h1><p>ይህ የካርድ ሙከራ ገጽ ብቻ ነው። ዋናውን Live Game አይቀይርም።</p><div class="panel"><label for="ids">Card numbers (1–1000, max 3)</label><div class="row" style="margin-top:8px"><input id="ids" value="27" placeholder="27,48,105"><button id="show">SHOW</button></div><div id="status" class="hint" style="margin-top:8px"></div></div><div id="cards"></div></div><script>
function cardFor(id){let seed=(Math.imul(id,2654435761)>>>0);const rand=()=>{seed=(Math.imul(seed,1664525)+1013904223)>>>0;return seed/4294967296};const cols=[];for(let c=0;c<5;c++){const pool=Array.from({length:15},(_,i)=>c*15+i+1);for(let i=14;i>0;i--){const j=Math.floor(rand()*(i+1));[pool[i],pool[j]]=[pool[j],pool[i]]}cols.push(pool.slice(0,5).sort((a,b)=>a-b))}return Array.from({length:5},(_,r)=>Array.from({length:5},(_,c)=>r===2&&c===2?0:cols[c][r]))}
function render(){const ids=[...new Set(document.getElementById('ids').value.split(/[,\s]+/).map(Number).filter(n=>Number.isInteger(n)&&n>=1&&n<=1000))].slice(0,3);const root=document.getElementById('cards');root.replaceChildren();document.getElementById('status').textContent=ids.length+' / 3 CARDS';for(const id of ids){const outer=document.createElement('div');outer.className='card';const title=document.createElement('div');title.className='head';title.textContent='CARD #'+String(id).padStart(4,'0');outer.append(title);const grid=document.createElement('div');grid.className='grid';'BINGO'.split('').forEach((l,i)=>{const d=document.createElement('div');d.className='cell letter';d.textContent=l;d.style.color=['#55b8ff','#ff7185','#35dbad','#c38aff','#f6c564'][i];grid.append(d)});const a=cardFor(id);for(let r=0;r<5;r++)for(let c=0;c<5;c++){const n=a[r][c],d=document.createElement('div');d.className='cell'+(n===0?' free':'');d.textContent=n||'FREE';grid.append(d)}outer.append(grid);root.append(outer)}}
document.getElementById('show').onclick=render;const q=new URLSearchParams(location.search).get('cards');if(q)document.getElementById('ids').value=q;render();</script></body></html>
