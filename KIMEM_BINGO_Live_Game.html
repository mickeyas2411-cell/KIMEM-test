.card-scroll-area{height:288px;overflow-y:auto;overscroll-behavior:contain;scrollbar-width:thin;scrollbar-color:#0077ff #020a1e}.card-scroll-area::-webkit-scrollbar{width:3px}.card-scroll-area::-webkit-scrollbar-thumb{background:#0077ff;border-radius:5px}.card-grid-item{min-width:0;height:34px;position:relative;border-radius:7px;background:linear-gradient(180deg,#102850,#030f2b);border:1px solid rgba(66,153,255,.48);box-shadow:inset 0 1px 0 #ffffff25,0 2px 3px #0005;color:white;font-size:12px;font-weight:800;display:flex;align-items:center;justify-content:center;cursor:pointer}.card-grid-item.soft-match:not(.selected){border-color:#5de3ff;box-shadow:0 0 0 1px #63ddff99,0 0 10px #26c8ff50;background:linear-gradient(180deg,#1a4770,#0b2247)}.card-grid-item.selected{background:linear-gradient(180deg,#ffe985,#d9961d)!important;border:1px solid #fff0a1!important;color:#4b3200!important;box-shadow:0 0 9px #ffbf42a6,inset 0 1px 0 #fff9!important}.card-grid-item .lock{font-size:8px;margin-left:2px;color:#7b560c}.card-grid-item:focus-visible{outline:2px solid #fff;outline-offset:1px}

/* Full-screen, balanced mobile and desktop proportions */
html,body{width:100%;height:100%;overflow:hidden}
body>div{height:100dvh;max-height:100dvh;width:100%;max-width:none}
.card-scroll-area{height:clamp(180px,30dvh,360px)}
main{scrollbar-width:thin;scrollbar-color:#1767be #06102a}

@media(max-height:700px){.card-scroll-area{height:clamp(140px,25dvh,210px)}.hero-banner{padding:8px}.stats-panel{min-height:57px}.bingo-tile{height:22px}.bingo-hdr{height:24px}}


/* Card matrix priority: ten columns x at least nine visible rows (90 cards). */
.card-scroll-area{height:310px!important;min-height:310px!important;flex-shrink:0;gap:3px!important;grid-auto-rows:28px;align-content:start}
.card-grid-item{height:28px!important;font-size:11px!important;border-radius:5px}
/* Miniature preview frees space for the card selection matrix. */
#bingo-board,#bingo-header{gap:2px!important}
.bingo-tile{height:15px!important;font-size:9px!important;border-radius:3px}
.bingo-hdr{height:17px!important;font-size:11px!important;border-radius:3px}
#bingo-board{max-width:220px;margin-inline:auto}
#bingo-header{max-width:220px;margin-inline:auto}
@media(min-width:700px){.card-scroll-area{height:340px!important;min-height:340px!important;grid-auto-rows:30px}.card-grid-item{height:30px!important}}

/* Approved update: inline locked-card chips and readable preview; card matrix untouched. */
.locked-inline{display:flex;align-items:center;gap:8px;min-width:0;flex-wrap:nowrap}
.locked-inline .locked-label{flex-shrink:0;margin:0;font-size:10px;letter-spacing:.08em;color:#93c5fd;font-weight:900}
.locked-inline .locked-row{min-width:0;flex:1;white-space:nowrap;min-height:31px}
.locked-inline .locked-chip{padding:5px 7px;font-size:10px}
#bingo-board,#bingo-header{max-width:370px!important;width:100%;gap:3px!important;margin-inline:auto}
.bingo-tile{height:clamp(26px,4.3dvh,39px)!important;font-size:clamp(13px,3.5vw,18px)!important;border-radius:6px!important}
.bingo-hdr{height:clamp(27px,4dvh,37px)!important;font-size:clamp(16px,4vw,22px)!important;border-radius:6px!important}
/* Full viewport cinematic five-second countdown. */
#countdown-scene{position:fixed;inset:0;z-index:1000;display:none;align-items:center;justify-content:center;flex-direction:column;padding:20px;background:radial-gradient(ellipse at center,#14377b 0%,#07142e 45%,#01040e 100%);overflow:hidden;isolation:isolate}
#countdown-scene.visible{display:flex;animation:sceneEnter .45s ease-out both}
#countdown-scene::before{content:'';position:absolute;width:130vmax;height:130vmax;border-radius:50%;background:repeating-conic-gradient(from 10deg,#20adff11 0deg 10deg,transparent 10deg 25deg);animation:slowSpin 18s linear infinite;pointer-events:none}
#countdown-scene::after{content:'';position:absolute;inset:0;background:radial-gradient(circle at center,transparent 25%,#01030b88 90%);pointer-events:none}
.scene-heading{position:relative;z-index:2;font-size:clamp(20px,5.7vw,42px);letter-spacing:.15em;text-align:center;font-weight:900;color:#fff;text-shadow:0 0 14px #43baff,0 0 35px #007bff;margin-bottom:clamp(30px,8vh,75px)}
.countdown-balls{position:relative;z-index:2;display:flex;align-items:center;justify-content:center;gap:clamp(5px,1.6vw,20px);width:100%;max-width:740px;perspective:900px}
.countdown-ball{--tone:#ee424c;position:relative;flex:0 1 125px;aspect-ratio:1;min-width:0;max-width:125px;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle at 31% 22%,#ffffffed 0%,#ffffff66 8%,transparent 29%),radial-gradient(circle at 32% 26%,color-mix(in srgb,var(--tone),white 35%),var(--tone) 50%,color-mix(in srgb,var(--tone),black 62%) 100%);border:2px solid #ffffff80;box-shadow:inset -11px -16px 19px #0008,inset 5px 6px 12px #fff7,0 13px 17px #000b,0 0 19px var(--tone);transform-style:preserve-3d}
.countdown-ball::after{content:'';position:absolute;top:9%;left:16%;width:49%;height:24%;border-radius:50%;background:linear-gradient(#fff9,#fff0);transform:rotate(-25deg);filter:blur(2px)}
.ball-face{font-size:clamp(22px,7vw,65px);font-weight:1000;color:#fff;text-shadow:0 3px 5px #0008,0 0 9px #fff9;backface-visibility:hidden;line-height:1;position:relative;z-index:1}
.countdown-ball.is-active{animation:ballBounce .9s cubic-bezier(.2,.6,.3,1) both;box-shadow:inset -11px -16px 19px #0008,inset 5px 6px 12px #fff9,0 24px 27px #0009,0 0 28px 10px var(--tone),0 0 70px var(--tone)}
.countdown-ball.is-active .ball-face{animation:faceFlip .7s ease-in-out both}
.countdown-ball.is-done{filter:brightness(1.1)}
.scene-footer{z-index:2;position:relative;color:#b7d5ff;font-size:clamp(11px,2.7vw,16px);font-weight:800;letter-spacing:.2em;margin-top:clamp(30px,7vh,65px)}
@keyframes sceneEnter{from{opacity:0;transform:scale(.87)}to{opacity:1;transform:scale(1)}}
@keyframes ballBounce{0%{transform:translateY(0) rotateY(0) scale(1)}30%{transform:translateY(-35px) rotateY(90deg) scale(1.16)}55%{transform:translateY(-47px) rotateY(180deg) scale(1.22)}75%{transform:translateY(6px) rotateY(300deg) scale(1.08)}100%{transform:translateY(0) rotateY(360deg) scale(1.05)}}
@keyframes faceFlip{0%,42%{opacity:1}48%,60%{opacity:.05}75%,100%{opacity:1}}
@keyframes slowSpin{to{transform:rotate(360deg)}}
@media(max-width:370px){.locked-inline{gap:5px}.locked-inline .locked-label{font-size:9px}.locked-inline .locked-chip{font-size:9px;padding:4px 5px}.countdown-balls{gap:5px}.countdown-ball{border-width:1px}}
@media(prefers-reduced-motion:reduce){#countdown-scene.visible,.countdown-ball.is-active,.countdown-ball.is-active .ball-face{animation:none}}

/* Live game extension; the approved lobby header, stats and bonus markup is reused verbatim. */
.live-stage{border:1px solid #24539a;background:radial-gradient(ellipse at 50% 36%,#123e79,#07142c 60%,#030a1d);border-radius:16px;overflow:hidden;padding:10px;position:relative}
.stage-top{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px}.stage-title{font-size:12px;font-weight:900;letter-spacing:.09em;color:#f7d27b}.live-status{font-size:10px;color:#90b5f0;font-weight:800}
.machine{height:clamp(185px,30dvh,295px);position:relative;overflow:hidden;border-radius:13px;border:1px solid #2b5c99;background:radial-gradient(circle at 30% 30%,#2d72ad55,transparent 50%),linear-gradient(135deg,#08152c,#0d2550 50%,#040b1e)}
.machine:before{content:'';position:absolute;inset:8px 20% 15px 5%;border-radius:50%;border:2px solid #6bb7ff66;background:radial-gradient(ellipse at 28% 22%,#ffffff25,transparent 55%);box-shadow:inset 0 0 24px #7cbbff29,0 0 20px #0d70ff35;pointer-events:none;z-index:2}
.machine:after{content:'';position:absolute;top:12px;left:13%;width:20%;height:35%;border-radius:50%;transform:rotate(-25deg);background:linear-gradient(110deg,#ffffff25,transparent);pointer-events:none;z-index:4}
.shuffle-ball,.result-ball,.history-ball{display:grid;place-items:center;border-radius:50%;font-weight:1000;color:#fff;text-shadow:0 2px 3px #0009;box-shadow:inset -8px -10px 13px #0008,inset 4px 5px 9px #fff8,0 5px 10px #0008;background:radial-gradient(circle at 28% 20%,#ffffffb5,transparent 25%),radial-gradient(circle at 40% 35%,var(--ball-light),var(--ball-color) 63%,#080e24 100%)}
.shuffle-ball{position:absolute;width:clamp(24px,7vw,43px);aspect-ratio:1;font-size:11px;left:var(--x);top:var(--y);animation:mix var(--speed) ease-in-out infinite alternate;animation-delay:var(--delay);z-index:1}
@keyframes mix{0%{transform:translate(-10px,10px) rotate(-40deg)}50%{transform:translate(20px,-22px) rotate(100deg)}100%{transform:translate(-17px,20px) rotate(240deg)}}
.machine:not(.shuffling) .shuffle-ball{animation-play-state:paused;opacity:.72}
.exit-tube{position:absolute;right:14%;top:5%;height:70%;width:13%;border:3px solid #8dd5ff88;border-radius:40px 40px 18px 18px;background:linear-gradient(90deg,#b4e8ff22,#b9f2ff08,#b9f2ff3d);box-shadow:inset 0 0 10px #a7dfff55;z-index:3;pointer-events:none}
.result-ball{position:absolute;z-index:6;width:clamp(65px,19vw,112px);aspect-ratio:1;right:1%;bottom:6%;font-size:clamp(21px,5vw,37px);border:2px solid #ffffff7d;opacity:0;transform:translate(-95px,-140px) scale(.4)}
.result-ball.out{animation:ballTravel 1.35s cubic-bezier(.2,.7,.3,1.05) forwards}
@keyframes ballTravel{0%{opacity:1;transform:translate(-90px,-140px) scale(.35) rotate(-220deg)}40%{opacity:1;transform:translate(-25px,-85px) scale(.7) rotate(110deg)}75%{opacity:1;transform:translate(4px,8px) scale(1.13) rotate(320deg)}100%{opacity:1;transform:translate(0,0) scale(1) rotate(360deg)}}
.last-five{display:flex;align-items:center;gap:6px;min-height:42px;flex-wrap:wrap}.history-ball{width:32px;height:32px;font-size:11px;border:1px solid #fff6}.history-ball small{font-size:7px}.last-label{font-size:10px;font-weight:900;color:#9db7e4;margin-right:4px}
.number-board{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:4px}.board-column{display:flex;flex-direction:column;gap:3px;min-width:0}.board-letter{height:30px;display:grid;place-items:center;border-radius:6px;font-size:18px;font-weight:1000;color:white}.board-number{height:clamp(23px,3.7dvh,34px);display:grid;place-items:center;border:1px solid #30446c;background:#142541;border-radius:5px;color:#cbd9f1;font-weight:800;font-size:clamp(11px,3vw,15px)}.board-number.called{background:linear-gradient(145deg,#ffe79b,#e9ad25 55%,#8e5509);color:#322000;border-color:#fff1a9;box-shadow:0 0 10px #ffcc44aa,inset 0 1px 2px #fff9}
.cards-head{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}.mode-group{display:flex;gap:4px;background:#08172f;border:1px solid #24416d;padding:3px;border-radius:9px}.mode-btn{padding:6px 12px;border-radius:6px;font-size:11px;font-weight:900;color:#95afd9}.mode-btn.active{background:#246be6;color:white}.my-cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,210px),1fr));gap:8px}.play-card{background:#09172e;border:1px solid #315285;border-radius:10px;padding:8px;min-width:0}.play-card-title{font-size:11px;font-weight:900;color:#f8d16c;margin-bottom:6px}.play-letters,.play-numbers{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:3px}.play-letters span{text-align:center;font-size:17px;font-weight:1000}.play-numbers{margin-top:4px}.play-cell{height:clamp(29px,7vw,43px);display:grid;place-items:center;border-radius:5px;background:linear-gradient(#f1f1eb,#999a9a);color:#172031;font-weight:900;font-size:clamp(12px,3vw,16px);border:1px solid #ffffff77}.play-cell.marked{background:linear-gradient(#ffeaa5,#d99d20);color:#352409;box-shadow:0 0 9px #eec34e88}.play-cell.free{background:linear-gradient(#72e7bd,#168568);color:white;font-size:10px}.play-cell.manual-touch{cursor:pointer}.bingo-action{background:linear-gradient(120deg,#e9b52e,#f7d775);color:#1b1830;border-radius:8px;padding:7px 18px;font-weight:1000;font-size:12px}.control-row{display:flex;align-items:center;gap:8px;justify-content:space-between;flex-wrap:wrap}.demo-control{background:#154eaa;border:1px solid #4a8ff9;border-radius:8px;padding:8px 12px;font-weight:800;font-size:11px}.demo-control:disabled{opacity:.4}.live-toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#142a51;border:1px solid #5b9efc;padding:10px 16px;border-radius:9px;z-index:90;font-size:12px;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90%;text-align:center}
@media(min-width:700px){.live-layout{display:grid;grid-template-columns:minmax(0,1fr) minmax(300px,.85fr);gap:12px}.live-layout>div{min-width:0}.machine{height:320px}}

/* KIMEM signature transparent drum and visibly connected draw channel */
.machine{height:clamp(250px,37dvh,380px);background:radial-gradient(ellipse at 34% 36%,#19457c 0%,#091a37 52%,#030916 100%);border:1px solid #3466a6;box-shadow:inset 0 0 30px #010819,0 0 16px #0a61c12b}
.machine-globe{position:absolute;left:5%;top:6%;width:65%;height:82%;border-radius:50%;border:3px solid #86caffaa;background:radial-gradient(ellipse at 35% 28%,#a8dfff22,transparent 56%),radial-gradient(ellipse at 55% 65%,#21559a36,#05112b55 76%);box-shadow:inset 9px 10px 25px #a4d9ff18,inset -12px -15px 28px #0009,0 0 24px #1591ff36;z-index:2;pointer-events:none}
.machine-globe:after{content:'';position:absolute;inset:5%;border:1px solid #b9edff20;border-radius:50%}
.globe-glint{position:absolute;left:12%;top:10%;width:23%;height:43%;border-radius:50%;transform:rotate(26deg);background:linear-gradient(90deg,#ffffff25,transparent);filter:blur(3px)}
.globe-floor{position:absolute;left:23%;right:23%;bottom:7%;height:6px;border-radius:50%;background:#9ad6ff66;filter:blur(4px)}
.machine:before,.machine:after{display:none}
.machine-chute{position:absolute;z-index:4;left:65%;top:40%;width:18%;height:15%;border-top:3px solid #9edfffaa;border-bottom:3px solid #9edfffaa;background:linear-gradient(#9cddff1c,#e6faff09,#73bfff2a);box-shadow:0 0 12px #3a9bff44;pointer-events:none}
.chute-highlight{position:absolute;left:0;right:0;top:2px;height:2px;background:#ffffff5c}
.draw-pocket{position:absolute;z-index:3;right:3%;top:34%;width:20%;height:31%;border:2px solid #f5c76c88;border-radius:30px;background:radial-gradient(ellipse at center,#183963,#061328);box-shadow:inset 0 0 15px #f4b84618,0 0 17px #e8ae4a26}
.pocket-caption{position:absolute;bottom:-22px;left:-15%;width:130%;text-align:center;color:#d8b979;font-size:8px;font-weight:900;letter-spacing:.08em}
.machine-foot{position:absolute;bottom:5px;left:0;right:0;text-align:center;color:#75a5d4;font-size:8px;letter-spacing:.17em;font-weight:900}
.shuffle-ball{z-index:1;width:clamp(25px,6.6vw,42px);font-size:clamp(8px,2vw,11px)}
.result-ball{width:clamp(55px,14vw,88px);right:6%;top:39%;bottom:auto;font-size:clamp(18px,4vw,28px);z-index:8;opacity:0;transform:translate(-160%,5%) scale(.55)}
.result-ball.out{animation:kimemBallExit 1.8s cubic-bezier(.24,.75,.3,1) forwards}
@keyframes kimemBallExit{0%{opacity:1;transform:translate(-210%,10%) scale(.62) rotate(-160deg)}30%{opacity:1;transform:translate(-120%,0%) scale(.73) rotate(-60deg)}60%{opacity:1;transform:translate(-52%,0%) scale(.83) rotate(120deg)}83%{opacity:1;transform:translate(6%,0%) scale(1.07) rotate(310deg)}100%{opacity:1;transform:translate(0,0) scale(1) rotate(360deg)}}
@media(max-width:420px){.machine{height:265px}.machine-globe{width:65%;height:73%;top:12%}.machine-chute{top:43%}.draw-pocket{top:36%;height:29%}.result-ball{top:40%;width:58px;height:58px}.shuffle-ball{width:26px;height:26px;font-size:8px}}

/* Minimal digital draw: scoped to live draw only. */
.machine.digital-machine{height:clamp(225px,33dvh,320px);border:1px solid #2c4265;background:linear-gradient(150deg,#0c1930,#060f20 75%);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:7px;box-shadow:none}
.machine.digital-machine:before,.machine.digital-machine:after{display:none}
.digital-letter{color:#f4c75e;font-weight:900;letter-spacing:.25em;font-size:13px;min-height:18px}
.digital-number{font-size:clamp(95px,21vw,155px);line-height:1.08;letter-spacing:-.075em;padding-right:.075em;font-weight:900;font-variant-numeric:tabular-nums;color:#fff}
.digital-number.reveal{animation:digitalReveal .4s cubic-bezier(.2,.8,.2,1) both}
@keyframes digitalReveal{from{opacity:.25;filter:blur(8px);transform:translateY(12px) scale(.95)}to{opacity:1;filter:blur(0);transform:translateY(0) scale(1)}}
.digital-progress{height:4px;background:#1b2d47;border-radius:12px;overflow:hidden;width:78%;margin:8px auto 0}
.digital-progress-fill{height:100%;width:0;background:#f4c75e}
.digital-side{display:grid;grid-template-columns:minmax(0,1fr) 108px;gap:9px;margin-top:10px;align-items:stretch}
.digital-side-card{border:1px solid #263f64;border-radius:10px;background:#08162b;padding:9px;min-width:0}
.digital-side-title{font-size:10px;color:#9db7e4;font-weight:900;letter-spacing:.06em;margin-bottom:8px}

 sphereFromAngle=sphereAngle;sphereFromPitch=spherePitch;
 sphereReveal={from:sphereCurrent||1,fromNumber:sphereCurrent,to:n,start:now};

function digitalTick(now){
 if(spherePhase==='server-reveal'){
  const t=clamp3((now-sphereStart)/1050,0,1),e=t<.85?t:.85+.15*(1-Math.pow(1-(t-.85)/.15,2));
  sphereAngle=sphereFromAngle+(Math.PI*4.5)*e;

  if(t>=1)kimemFlushServerBallVisual();

 }else if(spherePhase==='shuffle'){
  const t=now-sphereStart;
  if(t<4000){
   sphereAngle=t*.047;
   spherePitch=Math.sin(t*.019)*.65+Math.cos(t*.012)*.25;

    sphereSampleIndex=(sphereSampleIndex+1)%sphereSamples.length;sphereLastSwap=t;
   }
  }else { $('machine').classList.remove('kimem-shuffling');if(new URLSearchParams(location.search).get('sync')!=='0'){spherePhase='idle';sphereAngle=0;spherePitch=0;$('shuffle-status').textContent='';digitalTick.serverStaticRendered=false;}else beginSphereReveal(now); }
 }else if(spherePhase==='reveal'){
  if(!kimemRevealVoiceStarted&&spherePending&&now-sphereStart>=0){kimemRevealVoiceStarted=true;kimemCallBallAmharic(spherePending)}
  const t=clamp3((now-sphereStart)/1100,0,1),e=ease3(t);

 }else if(spherePhase==='waiting'&&running){
  sphereAngle=0;spherePitch=0;

 }

  }

 }

 else digitalTimer=requestAnimationFrame(digitalTick);
}

/* Opt-in read-only live synchronization. Local game behavior remains default. */
(function(){
 if(new URLSearchParams(location.search).get('sync')==='0')return;
 const endpoint='https://kimem-bingo-backend.mickeyas2411.workers.dev/api/bingo/round?stake=10';

async function kimemRefreshVerifiedMoney(roundCode){
 if(!/^AA[0-9]{6}$/.test(roundCode||''))return;
 try{
  const response=await fetch('https://qimem-pay.mickeyas2411.workers.dev/api/v1/public/bingo10/stats?round='+encodeURIComponent(roundCode),{cache:'no-store'});
  if(!response.ok)return;
  const d=await response.json();
  if(!d.ok||d.roundCode!==roundCode||!Number.isSafeInteger(d.players)||!Number.isSafeInteger(d.cardsSold)||!Number.isFinite(d.derash))return;
  const player=document.getElementById('kimem-verified-players');
  const sales=document.getElementById('kimem-verified-sales');
  if(player)player.textContent=d.players.toLocaleString('en-US');
  if(sales)sales.textContent=d.derash.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2})+' ETB';
  const funds=d.funds;
  if(funds&&['daily','weekly','jackpot'].every(k=>typeof funds[k]==='number'&&Number.isFinite(funds[k]))){
   const buttons=[...document.querySelectorAll('button')];
   for(const [i,name] of ['DAILY','WEEKLY','JACKPOT'].entries()){
    const btn=buttons.find(b=>b.textContent.includes(name)&&b.textContent.includes('ETB'));
    const label=btn?.querySelector('div:last-child > div:last-child');
    if(label)label.textContent=funds[name.toLowerCase()].toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2})+' ETB';
   }
  }
 }catch(e){console.warn('Bingo verified money unavailable',e)}
}

 let activeRound=null,redirecting=false,finished=false,syncBusy=false,kimemFirstServerSync=true,kimemShuffleTimeout=null;
 let kimemLastDisplayedId='';
 function showId(id){
  if(kimemLastDisplayedId===id)return;
  kimemLastDisplayedId=id;
  const labels=[...document.querySelectorAll('*')].filter(e=>e.children.length===0&&e.textContent?.trim()==='GAME ID');
  for(const label of labels){
   const parent=label.parentElement;
   const val=parent?.querySelector('.stat-value');
   if(val)val.innerHTML='<span style="color:#fbbf24">AA</span>'+id.slice(2);
  }
 }
 async function sync(){
  if(syncBusy||redirecting||window.kimemBingoEnding)return;
  syncBusy=true;
  try{
   const response=await fetch(endpoint,{cache:'no-store'});
   if(!response.ok)throw Error('Server unavailable');
   const payload=await response.json();
   const r=payload.round;
   if(!payload.ok||!r||r.stake!=='10'||!/^AA\d{6}$/.test(r.gameId))throw Error('Invalid round');
   const playersNode=document.getElementById('kimem-verified-players');
  const salesNode=document.getElementById('kimem-verified-sales');
  // Financial figures are supplied only by the verified purchase endpoint.
  // Do not overwrite them with unrelated draw-service counters.
  kimemRefreshVerifiedMoney(r.gameId);
  if(activeRound!==null&&activeRound!==r.roundNumber){
    if(!redirecting){redirecting=true;location.replace('./KIMEM_BINGO_Game_Lobby.html?sync=1&returned=1&v=20261021r2')}
    return;
   }
   // A new lobby round must not overwrite the last round actually played.
   // Otherwise the return guard mistakes the new 35-second lobby for the old live game.
   if(r.phase==='live'){
    try{sessionStorage.setItem('kimemLastLiveRound'+r.stake,String(r.roundNumber))}catch(e){}
   }
   activeRound=r.roundNumber;
   showId(r.gameId);
   if(r.phase==='lobby'){
    if(!redirecting){redirecting=true;location.replace('./KIMEM_BINGO_Game_Lobby.html?sync=1&returned=1&v=20261021r2')}
    return;
   }
   // Render only authoritative server draws; never generate local numbers.
   if(Array.isArray(r.drawn)){
    const samePrefix=drawn.every((n,i)=>r.drawn[i]===n);
    if(!samePrefix){drawn=[];board();cards();}
    const pending=r.drawn.slice(drawn.length);
    if(kimemFirstServerSync&&pending.length>0&&spherePhase==='shuffle'){
     spherePhase='idle';$('machine').classList.remove('kimem-shuffling');$('shuffle-status').textContent='';sphereAngle=0;spherePitch=0;
    }
    const isNewServerBall=!kimemFirstServerSync&&pending.length===1;
    const drawBatch=pending.length>1;
    if(!isNewServerBall)kimemFlushServerBallVisual();
    window.kimemDeferServerBallVisual=isNewServerBall?pending[0]:0;
    window.kimemServerDrawBatch=drawBatch;
    for(const n of pending){
     if(!Number.isInteger(n)||n<1||n>75||drawn.includes(n))continue;
     updateDraw(n);
     $('digital-letter').textContent=letter(n);
     $('digital-number').textContent=String(n).padStart(2,'0');
     $('machine').style.setProperty('--studio-tone',colors[tone(n)]);
    }
    if(pending.length){
     digitalTick.serverStaticRendered=false;
     if(!isNewServerBall){
      const latest=drawn[drawn.length-1];
      if(latest){sphereCurrent=latest;spherePending=0;sphereReveal=null;spherePhase='idle';sphereAngle=0;spherePitch=0;}
     }
    }
    if(isNewServerBall){
     const latest=pending[0];
     kimemCallBallAmharic(latest);
     // Animate only the authoritative server number; no local random draw or duplicate voice.
     spherePending=latest;
     sphereFromAngle=sphereAngle;
     sphereFromPitch=spherePitch;
     sphereStart=performance.now();
     sphereReveal={from:sphereCurrent||1,fromNumber:sphereCurrent,to:latest,start:sphereStart};
     spherePhase='server-reveal';
     digitalTick.serverStaticRendered=false;
    }
    kimemFirstServerSync=false;
    window.kimemServerDrawBatch=false;
    if(drawBatch)cards();
    // Only the authoritative backend can finish a synced round. Local card
    // matches must not stop polling or return to the lobby prematurely.
    // Otherwise the old round continues drawing while the lobby says WAIT.
   }
   running=false;
   if(r.phase==='finished'){
    $('draw-status').textContent='ROUND FINISHED';
    if(!finished){finished=true;window.kimemBingoEnding=true;kimemFinishGame(Array.isArray(r.winners)?r.winners:[])}
   }else $('draw-status').textContent='LIVE · SERVER SYNC';
  }catch(e){$('draw-status').textContent='WAITING FOR SERVER'}
  finally{syncBusy=false}
 }
 function begin(){running=false;sync();setInterval(sync,1500)}
 if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',begin);
 else begin();
})();
