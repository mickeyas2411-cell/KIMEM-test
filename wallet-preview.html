<!doctype html><html lang="am"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#071326"><title>QIMEM BINGO | Wallet Preview</title><script src="https://telegram.org/js/telegram-web-app.js"></script><style>
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 80% 0,#17315a,#071326 60%);color:#eef4ff;font-family:system-ui,-apple-system,sans-serif}.wrap{max-width:480px;margin:auto;padding:22px 16px 36px}.top{display:flex;justify-content:space-between;align-items:center}.brand{font-size:21px;font-weight:900;letter-spacing:1px}.tag{font-size:11px;border:1px solid #d6ae58;color:#f4d37d;border-radius:20px;padding:5px 9px}.card{margin-top:20px;background:linear-gradient(145deg,#182d52,#0e1b34);border:1px solid #31496b;border-radius:22px;padding:20px;box-shadow:0 16px 35px #0004}.muted{color:#a6b6d0;font-size:13px}.balance{font-size:38px;font-weight:850;margin:8px 0}.gold{color:#f2c76b}.row{display:flex;justify-content:space-between;align-items:center;gap:10px}.stakes{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:17px}button{font:inherit;cursor:pointer}.stake{border:1px solid #35547e;background:#132746;color:#e9f1ff;border-radius:13px;padding:14px 8px;font-weight:750}.stake.active{background:#24456b;border-color:#e6c274;color:#ffdf87}.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-top:16px}.num{border:1px solid #35547e;background:#142745;color:white;border-radius:11px;aspect-ratio:1;min-width:0;font-weight:700}.num.selected{background:#c99b45;color:#08142a;border-color:#f7d17b}.num:disabled{opacity:.38}.foot{margin-top:14px;font-size:12px;color:#a9b8d0;line-height:1.6}.notice{padding:12px;background:#102e3a;border:1px solid #2e6c70;border-radius:12px;color:#a8e9d3;font-size:13px;margin-top:16px}.error{background:#3b1828;border-color:#9d415a;color:#ffc0cc}.back{display:inline-block;color:#eac776;text-decoration:none;margin-top:20px;font-size:13px}.small{font-size:13px}.history{padding:10px 0;border-bottom:1px solid #31415b}.history:last-child{border-bottom:0}
</style></head><body><main class="wrap"><div class="top"><div class="brand">QIMEM <span class="gold">BINGO</span></div><span class="tag">WALLET PREVIEW</span></div><div class="card"><div class="muted">የሙከራ ዋሌት · Demo Balance</div><div class="balance"><span id="balance">100.00</span> <span class="gold" style="font-size:18px">ETB</span></div><div class="row muted"><span>10 ብር እና 20 ብር የጋራ ባላንስ</span><span>Demo only</span></div></div><div class="card"><div class="row"><b>የካርድ ምርጫ</b><span id="count" class="muted">0 / 3</span></div><div class="stakes"><button class="stake active" id="s10">10 ETB</button><button class="stake" id="s20">20 ETB</button></div><div class="grid" id="cards"></div><div id="message" class="notice">ካርድ ምረጥ፤ ባላንስ ይቀነሳል። ምርጫውን ስታነሳ Refund ይመለሳል።</div><div class="foot">ይህ ገጽ የWallet ተግባር ማሳያ ብቻ ነው። የTelegram ተጫዋቾችን ወይም Live Game መዝገብ አይቀይርም። እውነተኛ ክፍያ የለም።</div></div><div class="card"><b>የሙከራ እንቅስቃሴ</b><div id="history" class="small muted" style="margin-top:10px">ገና እንቅስቃሴ የለም።</div></div><a class="back" href="./index.html">← QIMEM GAMES</a></main><script>
try{window.Telegram?.WebApp?.ready();window.Telegram?.WebApp?.expand()}catch(e){}
const KEY="qimem-wallet-preview-v1";let stake=10;let state;
try{state=JSON.parse(localStorage.getItem(KEY))}catch(e){}
if(!state||!Number.isInteger(state.balance)||!state.selected||!Array.isArray(state.history))state={balance:10000,selected:{"10":[],"20":[]},history:[]};
const el=id=>document.getElementById(id);
function persist(){localStorage.setItem(KEY,JSON.stringify(state))}
function notice(text,error=false){el("message").textContent=text;el("message").className="notice"+(error?" error":"")}
function render(){el("balance").textContent=(state.balance/100).toFixed(2);el("count").textContent=state.selected[stake].length+" / 3";el("s10").classList.toggle("active",stake===10);el("s20").classList.toggle("active",stake===20);el("cards").innerHTML="";for(let i=1;i<=30;i++){const btn=document.createElement("button");btn.className="num"+(state.selected[stake].includes(i)?" selected":"");btn.textContent=i;btn.onclick=()=>toggle(i);el("cards").appendChild(btn)}el("history").innerHTML="";if(!state.history.length)el("history").textContent="ገና እንቅስቃሴ የለም።";for(const entry of state.history.slice(0,8)){const div=document.createElement("div");div.className="history";div.textContent=entry;el("history").appendChild(div)}}
function toggle(card){const list=state.selected[stake];const idx=list.indexOf(card);if(idx>=0){list.splice(idx,1);state.balance+=stake*100;state.history.unshift(stake+" ETB · Card #"+card+" · Refund +"+stake+" ETB");notice("Card #"+card+" ተነስቷል፤ "+stake+" ETB ተመልሷል።")}else{if(list.length>=3){notice("በአንድ ጨዋታ ከ3 ካርድ በላይ መምረጥ አይቻልም።",true);return}if(state.balance<stake*100){notice("በቂ Demo Balance የለም።",true);return}list.push(card);state.balance-=stake*100;state.history.unshift(stake+" ETB · Card #"+card+" · Charge -"+stake+" ETB");notice("Card #"+card+" ተመርጧል፤ "+stake+" ETB ተቀንሷል።")}persist();render()}
el("s10").onclick=()=>{stake=10;render()};el("s20").onclick=()=>{stake=20;render()};render();
</script></body></html>
